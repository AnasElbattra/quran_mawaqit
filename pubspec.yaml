name: quran_mawaqit
description: "Quran as text"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.4.3
dependencies:
  flutter:
    sdk: flutter
  sizer: ^2.0.15
  archive: ^4.0.5
  path_provider: ^2.1.5
  http: ^1.3.0
  quran:
    path: ./packages/quran-1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.2

flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - lib/images/

  fonts:
    - family: hafs
      fonts:
        - asset: lib/fonts/uthmanic_hafs_v22.ttf
          weight: 500
    - family: UthmanicHafs13
      fonts:
        - asset: lib/fonts/UthmanicHafs13.otf
